name: release

# Publishes to npm with a provenance attestation, the same way as the other
# lolkda/dsh-* plugins: npm trusted publishing (OIDC) — there is deliberately
# no NPM_TOKEN secret to rotate. `id-token: write` is what npm exchanges for a
# short-lived publish credential.
#
# Triggers:
#   * push a tag matching v<package.json version> -> real publish
#   * workflow_dispatch with dry_run=true (default) -> full pipeline, no publish
#
# One-time prerequisite on npmjs.com: add this repository as a Trusted
# Publisher for the package (Settings -> Trusted Publisher):
#   publisher:            GitHub Actions
#   organization or user: lolkda
#   repository:           dsh-agent-team-model-pin
#   workflow filename:    release.yml

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run the whole pipeline but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance; no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke the built entry
        run: npm run smoke:dist

      - name: The tag must name the version being published
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi
          echo "publishing ${pkg}"

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --dry-run

      - name: Publish
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
