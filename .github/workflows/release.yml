name: release

# Packages @lolkda/dsh-agent-team-model-pin, verifies it, and publishes the exact
# tarball the verify job built — the published bytes are the verified bytes.
#
# Publishing is npm trusted publishing (OIDC): GitHub mints a short-lived
# identity token, npm exchanges it for publish rights on this package, and
# `npm publish --provenance` records which workflow and commit built the
# tarball. No long-lived token is stored in this repository and no 2FA prompt
# can appear in CI. A 2FA-protected account cannot publish from CI with a token
# at all: npm answers `EOTP: This operation requires a one-time password`, and
# granular tokens that bypass 2FA are being withdrawn for direct publishing.
#
# Two npm-side prerequisites, both one-time and both needing the maintainer's
# 2FA, so both happen outside CI:
#
#   1. The package must already exist. npm refuses to configure a trusted
#      publisher for a package the registry does not have yet ("Package must
#      exist", npm trust prerequisites), and a staged publish of a new package
#      returns the same 404. The first publish is therefore an upload from a
#      machine where the maintainer can answer the OTP prompt, using the tarball
#      this workflow produced:
#        npm publish <tarball> --access public --tag next
#        npm dist-tag add @lolkda/dsh-agent-team-model-pin@<version> latest
#   2. Register this workflow as a trusted publisher:
#        npm trust github @lolkda/dsh-agent-team-model-pin \
#          --repo lolkda/dsh-agent-team-model-pin --file release.yml --allow-publish -y
#      Equivalent one-time setup on npmjs.com -> the package -> Settings ->
#      Trusted Publisher:
#        publisher:            GitHub Actions
#        organization or user: lolkda
#        repository:           dsh-agent-team-model-pin
#        workflow filename:    release.yml
#
# Triggers:
#   * push a tag matching v<package.json version>    -> real publish
#   * workflow_dispatch with dry_run=true (default)  -> full pipeline, no publish
#   * workflow_dispatch with dry_run=false           -> real publish
#
# Dist-tags: a stable version owns `latest`; a prerelease owns `next`. Trusted
# publishing covers `npm publish` only — npm accepts dist-tag writes from a
# token, which this workflow deliberately does not have — so a prerelease that
# would leave the package uninstallable by its bare name stops the release
# instead of publishing something nobody can install.
# scripts/release-plan.mjs makes that decision from the live registry and is
# covered by tests/release.test.mjs.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: run the whole pipeline but do not publish'
        type: boolean
        default: true

# A publish is irreversible; never let two runs race on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Never pin the runtime here: a literal is how this gate silently drifted
      # from the package it was gating. The peer range and the devDependency in
      # package.json are the contract, so the runtime is read from there.
      - name: Resolve the DSH runtime version from package.json
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").devDependencies["@deepseek-ai/dsh-agent"]')"
          peer="$(node -p 'require("./package.json").peerDependencies["@deepseek-ai/dsh-agent"]')"
          if [ -z "${version}" ]; then
            echo "::error::package.json declares no @deepseek-ai/dsh-agent devDependency to verify against"
            exit 1
          fi
          if [ "${version}" != "${peer}" ]; then
            echo "::error::package.json disagrees with itself: peer ${peer} vs expected ${version}"
            exit 1
          fi
          echo "DSH_RUNTIME_VERSION=${version}" >> "$GITHUB_ENV"
          echo "the integration suites will run against DSH ${version}"

      # The native Client, cold start and Web restart suites skip themselves
      # when the machine has no DSH installation, and `node --test` still exits
      # 0. A release gate that skipped them would prove almost nothing, so
      # install the runtime and pin DSH_TEST_INSTALL_ROOT explicitly.
      - name: Install the DSH runtime the integration suites need
        run: |
          set -euo pipefail
          npm install --global "@deepseek-ai/dsh@${DSH_RUNTIME_VERSION}"
          root="$(npm root --global)/@deepseek-ai/dsh"
          test -f "${root}/lib/profile-boot.js" || {
            echo "::error::no DSH runtime at ${root}; refusing to publish behind a gate that would silently skip the integration suites"
            exit 1
          }
          echo "DSH_TEST_INSTALL_ROOT=${root}" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test, requiring the integration suites to run
        run: |
          set -euo pipefail
          npm run --silent test:tap | tee /tmp/test.tap
          skipped="$(sed -n 's/^# skipped \([0-9][0-9]*\)$/\1/p' /tmp/test.tap | tail -1)"
          if [ "${skipped:-missing}" != "0" ]; then
            echo "::error::${skipped:-an unknown number of} test(s) skipped; refusing to publish behind a gate that did not run the DSH-backed integration suites"
            exit 1
          fi

      - name: Smoke the built entries
        run: npm run smoke:dist

      - name: The tag must name the version being published
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${version}"
            exit 1
          fi
          echo "release version ${version}"

      # Logs the registry state and the dist-tag this release would use. The
      # publish job re-runs the same script so its decision is made against the
      # registry as it is at publish time, not as it was here.
      - name: Show the dist-tag plan
        run: node scripts/release-plan.mjs

      - name: Pack the tarball that will be published
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          npm pack --json > /tmp/pack.json
          filename="$(node -p 'require("/tmp/pack.json")[0].filename')"
          mv "${filename}" "release-artifact/${filename}"
          tarball="release-artifact/${filename}"
          sha256sum "${tarball}" | tee release-artifact/SHA256SUMS.txt

          # `files` in package.json is the packaging contract: the built entries
          # and the bundle patch ship, source and tests never do.
          contents="$(tar -tzf "${tarball}" | sed 's:/$::')"
          for required in \
            package/dist/index.js package/dist/index.d.ts package/dist/web.js \
            package/dist/client.js package/cordis.patch.yml package/README.md package/LICENSE
          do
            printf '%s\n' "${contents}" | grep -qx "${required}" || {
              echo "::error::${required} is missing from ${tarball}"
              exit 1
            }
          done
          if printf '%s\n' "${contents}" | grep -qE '^package/(src|tests|docs)/'; then
            echo "::error::${tarball} ships source, tests or docs; package.json files must keep them out"
            printf '%s\n' "${contents}" | grep -E '^package/(src|tests|docs)/'
            exit 1
          fi
          printf '%s\n' "${contents}"

      - name: Hand the verified tarball to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token trusted publishing and provenance need
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tarball the verify job built
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: release-artifact

      # No `npm ci`, no rebuild, no lifecycle scripts: publishing a tarball
      # publishes exactly those bytes, and the gate that approved them ran in
      # the verify job.
      - name: Locate the tarball
        id: tarball
        run: |
          set -euo pipefail
          count="$(find release-artifact -maxdepth 1 -name '*.tgz' | wc -l)"
          if [ "${count}" != "1" ]; then
            echo "::error::expected exactly one tarball in release-artifact, found ${count}"
            ls -l release-artifact
            exit 1
          fi
          # The path must be absolute. npm parses `release-artifact/pkg.tgz` as
          # the GitHub shorthand owner/repo and tries `git ls-remote`, which
          # fails as a permission error instead of publishing the local file.
          tarball="$(realpath "$(find release-artifact -maxdepth 1 -name '*.tgz')")"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "publishing ${tarball}"
          cat release-artifact/SHA256SUMS.txt

      - name: Decide the dist-tag from the live registry
        id: plan
        run: node scripts/release-plan.mjs

      # Trusted publishing cannot create the package: npm wants a trusted
      # publisher configured for a package that already exists. Failing here
      # explains that, where npm's own answer is a bare 404.
      - name: The package must already exist on npm
        if: steps.plan.outputs.first_publish == 'true' && (github.ref_type == 'tag' || inputs.dry_run == false)
        run: |
          echo "::error::${{ steps.plan.outputs.name }} is not on the registry yet, and trusted publishing cannot create it."
          echo "::error::   1. publish once from a machine that can answer the 2FA prompt:"
          echo "::error::        npm publish <tarball> --access public --tag ${{ steps.plan.outputs.dist_tag }}"
          echo "::error::        npm dist-tag add ${{ steps.plan.outputs.name }}@${{ steps.plan.outputs.version }} latest"
          echo "::error::   2. then register this workflow as its trusted publisher:"
          echo "::error::        npm trust github ${{ steps.plan.outputs.name }} --repo lolkda/dsh-agent-team-model-pin --file release.yml --allow-publish -y"
          exit 1

      # npm accepts dist-tag writes from a token only, and this workflow has
      # none, so a prerelease must not be published while no `latest` exists:
      # the bare package name would install nothing at all.
      - name: Refuse to publish something nobody can install
        if: steps.plan.outputs.latest_missing == 'true' && (github.ref_type == 'tag' || inputs.dry_run == false)
        run: |
          set -euo pipefail
          spec="${{ steps.plan.outputs.name }}@${{ steps.plan.outputs.version }}"
          echo "::error::${spec} is a prerelease and the registry has no latest tag, so 'npm install ${{ steps.plan.outputs.name }}' would resolve to nothing."
          echo "::error::Trusted publishing cannot write dist-tags. Either point latest at a version yourself (npm dist-tag add <pkg>@<version> latest, with 2FA), or release a stable version instead."
          exit 1

      # A manual run exercises the whole publish path — the tarball, the
      # registry state, the tag — without touching the registry.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          npm publish "${{ steps.tarball.outputs.tarball }}" \
            --dry-run --access public --tag "${{ steps.plan.outputs.dist_tag }}"

      - name: Publish with OIDC trusted publishing
        if: github.ref_type == 'tag' || inputs.dry_run == false
        run: |
          set -euo pipefail
          if npm publish "${{ steps.tarball.outputs.tarball }}" \
            --provenance --access public --tag "${{ steps.plan.outputs.dist_tag }}"; then
            exit 0
          fi
          # A provenance signature proves the build, not that npm authorized the
          # upload; an unauthorized OIDC publish fails as a bare 404.
          echo "::error::npm rejected the OIDC publish. Check, in order:"
          echo "::error::  1. the package exists on npm — a trusted publisher can only be configured for a package that already exists"
          echo "::error::  2. the trusted publisher is registered: npm trust github ${{ steps.plan.outputs.name }} --repo lolkda/dsh-agent-team-model-pin --file release.yml --allow-publish"
          echo "::error::  3. package.json repository.url matches this repository exactly"
          exit 1

      - name: Verify what the registry now serves
        if: github.ref_type == 'tag' || inputs.dry_run == false
        run: |
          set -euo pipefail
          name="${{ steps.plan.outputs.name }}"
          version="${{ steps.plan.outputs.version }}"
          registry="https://registry.npmjs.org/"
          escaped="${name/\//%2f}"

          # Not `npm view`: that reads the full package document, which served a
          # stale 404 at the CDN edge for minutes after the first publish. The
          # version document and the dist-tags endpoint answer fresh, and they are
          # the two facts worth checking — this version is served, and the tag the
          # plan chose points at it.
          document=/tmp/published-version.json
          for attempt in 1 2 3 4 5; do
            if curl -sf "${registry}${escaped}/${version}" -o "${document}"; then
              break
            fi
            echo "attempt ${attempt}: ${registry}${escaped}/${version} is not served yet, retrying"
            sleep 5
          done
          if ! test -s "${document}"; then
            echo "::error::${name}@${version} was published but ${registry}${escaped}/${version} still answers nothing"
            exit 1
          fi
          served="$(node -p 'require("/tmp/published-version.json").version')"
          if [ "${served}" != "${version}" ]; then
            echo "::error::the registry serves ${served} where ${version} was published"
            exit 1
          fi
          tagged="$(TAGS="$(curl -sf "${registry}-/package/${escaped}/dist-tags")" \
            TAG="${{ steps.plan.outputs.dist_tag }}" node -e '
              const tags = JSON.parse(process.env.TAGS)
              process.stdout.write(String(tags[process.env.TAG] ?? ""))
            ')"
          echo "dist-tags: $(curl -sf "${registry}-/package/${escaped}/dist-tags")"
          if [ "${tagged}" != "${version}" ]; then
            echo "::error::${name}@${version} was published under ${{ steps.plan.outputs.dist_tag }}, but that tag points at '${tagged}'"
            exit 1
          fi
          echo "published ${name}@${version} under ${{ steps.plan.outputs.dist_tag }}"
